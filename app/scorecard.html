<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorecard · Grew Puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../styles/theme.css">
<link rel="stylesheet" href="../styles/site-bar.css">
<link rel="stylesheet" href="../styles/browse.css">
<link rel="stylesheet" href="../styles/scorecard.css">
<link rel="stylesheet" href="../styles/look.css">
<link rel="stylesheet" href="../styles/blueprint.css">
</head>
<body>
<div class="wrap">
  <header class="site" data-site-bar data-home="index.html" data-current="scorecard"></header>
  <main aria-labelledby="score-title">
    <div class="browse-head score-head">
      <h1 id="score-title">Scorecard</h1>
      <span id="total"></span>
    </div>
    <p class="score-sign-in" id="sign-in-line" hidden><button class="sign-in-link" id="score-sign-in" type="button">Sign in</button> to tick off what you finish.</p>
    <div class="score-tabs" id="tabs" role="tablist" aria-label="Group by"></div>
    <div class="score-groups" id="groups"></div>
  </main>
</div>
<script src="../components/site-bar.js"></script>
<script src="../vendor/supabase.js"></script>
<script type="module" src="../ui/sign-in-ui.js"></script>
<script type="module" src="../ui/side-bar-ui.js"></script>
<script type="module">
import { tabs, scoreItems, scoreGroups, toggleOpen, scoreTotal, signInLineHidden } from '../core/scorecard-core.js';
import { wireDone, withDone } from '../ui/wordsearch/done-ui.js';
import { openSignIn } from '../ui/sign-in-ui.js';
import { readPuzzles } from '../ui/indexes-ui.js';
import { randomCharacter, charactersFile, charactersOf } from '../core/theme-core.js';
import { dressScene } from '../ui/theme-ui.js';

const groups = document.getElementById('groups');
const BOX_LABELS = { true: 'Finished', false: 'Not finished' };
let items = [];
// The tab picked — By kind, as the page opens — and the groups whose Show all is pressed.
let by = 'kind';
let open = [];
// The puzzles the player has finished — none until they're looked up, and never signed out — and
// whether the look-up has come back yet, and found anyone signed in.
let done = [];
let known = false;
let signedIn = false;

function part(tag, className, text) {
  const el = document.createElement(tag);
  el.className = className;
  el.textContent = text;
  return el;
}

// A line: its box, ticked once finished, its title linking to its play page, then its pill and —
// wider than a phone — its code.
function line(spec) {
  const a = part('a', 'score-line', '');
  a.href = spec.href;
  a.dataset.done = spec.done;
  const box = part('span', 'box', '');
  box.setAttribute('role', 'img');
  box.setAttribute('aria-label', BOX_LABELS[spec.done]);
  const pill = part('span', 'pill', spec.pill.label);
  pill.dataset.tone = spec.pill.tone;
  const meta = part('span', 'meta', '');
  meta.append(pill, part('span', 'code', spec.code));
  a.append(box, part('span', 'title', spec.title), meta);
  const li = document.createElement('li');
  li.append(a);
  return li;
}

function group(spec) {
  const section = part('section', 'score-group', '');
  section.dataset.tone = spec.tone;
  section.dataset.key = spec.key;
  const h2 = part('h2', '', '');
  h2.append(part('span', 'kind-tag', spec.kindName), spec.name);
  const count = part('span', 'count', spec.count);
  count.dataset.all = spec.all;
  const head = part('div', 'group-head', '');
  head.append(h2, count);
  const lines = part('ul', 'lines', '');
  lines.append(...spec.lines.map(line));
  const more = part('button', 'more', spec.more);
  more.type = 'button';
  more.hidden = !spec.more;
  more.addEventListener('click', () => showMore(spec.key));
  section.append(head, lines, more);
  return section;
}

function draw() {
  document.getElementById('total').textContent = scoreTotal(items, done, signedIn);
  document.getElementById('sign-in-line').hidden = signInLineHidden(known, signedIn);
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.by === by)));
  groups.replaceChildren(...scoreGroups(items, by, done, signedIn, open).map(group));
}

// Show all and Show fewer redraw the groups, the keyboard staying on the group's button.
function showMore(key) {
  open = toggleOpen(open, key);
  draw();
  groups.querySelector(`[data-key="${CSS.escape(key)}"] .more`).focus();
}

function tab(spec) {
  const b = part('button', '', spec.label);
  b.type = 'button';
  b.setAttribute('role', 'tab');
  b.dataset.by = spec.by;
  b.addEventListener('click', () => {
    by = spec.by;
    open = [];
    draw();
  });
  return b;
}
document.getElementById('tabs').append(...tabs().map(tab));
document.getElementById('score-sign-in').addEventListener('click', openSignIn);

// The ticks come from the one read of the player's progress the browse tiles' come from, again at
// every sign-in change, so signing out empties every box.
function tick(progress) {
  done = progress.done;
  signedIn = progress.signedIn;
  known = true;
  draw();
}

// The list never waits for the ticks. A page brought back from the browser's cache — back, after
// finishing a puzzle — looks them up again.
const RETURNS = { true: () => withDone(items, tick), false: () => {} };
window.addEventListener('pageshow', e => RETURNS[e.persisted]());

function load([puzzles, owned]) {
  dressScene(randomCharacter(owned, Math.random));
  items = scoreItems(puzzles);
  draw();
  wireDone(items, tick);
}

// A kind not yet published has no index and reads as none; characters that can't be read dress
// nothing — the list still draws.
Promise.all([
  readPuzzles(),
  fetch(charactersFile()).then(r => r.json()).then(charactersOf).catch(() => []),
]).then(load);
</script>
</body>
</html>

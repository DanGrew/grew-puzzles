<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grew Puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../styles/theme.css">
<link rel="stylesheet" href="../styles/site-bar.css">
<link rel="stylesheet" href="../styles/play.css">
<link rel="stylesheet" href="../styles/crisscross.css">
</head>
<body class="play-page criss-page">
<div class="wrap">
  <header class="site" data-site-bar data-home="index.html" data-current="crisscross"></header>

  <header class="play-head">
    <h1 id="title"></h1>
    <p class="ident" id="ident" hidden><span class="difficulty" id="difficulty"></span> · <span class="code" id="code"></span></p>
  </header>

  <p class="missing" id="missing" hidden>There's no puzzle at this address. <a href="index.html">See all puzzles</a>.</p>

  <main class="play criss" id="play" hidden>
    <div class="criss-col">
      <div class="stage" id="stage">
        <div class="card" id="card">
          <div class="face front-face" id="front">
            <div class="band" id="label"></div>
            <!-- The frame: the shape behind it, at the player's zoom. -->
            <div class="board" id="board">
              <div class="criss-view" id="view">
                <div class="criss-world" id="world">
                  <div class="criss-grid" id="grid"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="face back-face" id="back" aria-hidden="true" inert>
            <div class="band" id="solution-label"></div>
            <div class="board">
              <div class="criss-view">
                <div class="criss-world" id="solution-world">
                  <div class="criss-grid" id="solution-grid"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <button class="corner zoom-out" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 8h9"/></svg>
        </button>
        <button class="corner zoom-in" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 8h9M8 3.5v9"/></svg>
        </button>
        <button class="corner flip" id="flip" type="button" aria-pressed="false" aria-label="Show solution" title="Show solution">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 0 1 9.6-3.7M13.5 8a5.5 5.5 0 0 1-9.6 3.7"/><path d="M12.4 1.8v2.8H9.6M3.6 14.2v-2.8h2.8"/></svg>
        </button>
      </div>
      <div class="complete" id="complete" aria-live="polite"></div>
    </div>

    <!-- Over the Words card while zoomed in, the little map; on a phone, under the shape, the map and
         the words of the slot picked, so a word is placed without scrolling. -->
    <div class="criss-dock" id="dock">
      <div class="map-box" id="map-box">
        <canvas class="minimap" id="minimap" aria-hidden="true"></canvas>
        <div class="map-sizes" role="group" aria-label="Map size">
          <button type="button" data-map-size="small" aria-pressed="true" aria-label="Small map" title="Small map">S</button>
          <button type="button" data-map-size="medium" aria-pressed="false" aria-label="Medium map" title="Medium map">M</button>
          <button type="button" data-map-size="large" aria-pressed="false" aria-label="Large map" title="Large map">L</button>
        </div>
      </div>
      <div class="pick-strip" id="strip">
        <p class="picking" id="strip-picking"><span></span><b></b><span></span></p>
        <div class="chips" id="strip-chips"></div>
      </div>
    </div>

    <!-- Beside the shape, or under it on a phone: the words, grouped by length. -->
    <aside id="words-card">
      <div class="words-box">
        <div class="list-head">
          <h2>Words</h2>
          <span class="count" id="count"></span>
        </div>
        <p class="picking" id="picking"><span></span><b></b><span></span></p>
        <div class="groups" id="groups"></div>
      </div>
      <p class="help">Tap a square to pick its slot. Tap again where two slots cross to switch direction. Then tap a word to put it in. Tap a crossed-off word to take it back out. Every puzzle can be solved by reasoning alone: no guessing needed.</p>
    </aside>
  </main>
</div>
<script src="../components/site-bar.js"></script>
<script src="../vendor/supabase.js"></script>
<script type="module" src="../ui/sign-in-ui.js"></script>
<script type="module" src="../ui/side-bar-ui.js"></script>
<script type="module">
import { openCrissPage } from '../ui/crisscross/play-ui.js';
openCrissPage(location.search);
</script>
</body>
</html>

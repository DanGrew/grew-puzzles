<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grew Puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../styles/theme.css">
<link rel="stylesheet" href="../styles/site-bar.css">
<link rel="stylesheet" href="../styles/play.css">
<link rel="stylesheet" href="../styles/maze.css">
<link rel="stylesheet" href="../styles/look.css">
</head>
<body>
<div class="wrap">
  <header class="site" data-site-bar data-home="index.html" data-current="maze"></header>

  <header class="play-head">
    <h1 id="title"></h1>
    <p class="created" id="created"></p>
  </header>

  <p class="missing" id="missing" hidden>There's no puzzle at this address. <a href="index.html">See all puzzles</a>.</p>

  <main class="play maze" id="play" hidden>
    <div class="col">
      <div class="stage" id="stage">
        <div class="card" id="card">
          <div class="face front-face" id="front">
            <div class="band" id="label"></div>
            <!-- The frame: the maze behind it, only the cells round the view drawn. -->
            <div class="board" id="board">
              <div class="maze-view" id="view">
                <div class="maze-world" id="world">
                  <div class="maze-grid" id="grid"></div>
                  <div class="maze-marks" id="marks" aria-hidden="true"></div>
                  <svg class="maze-lines" id="lines" aria-hidden="true">
                    <path class="walls" id="walls"></path>
                    <polyline class="trail" id="trail"></polyline>
                    <circle class="here" id="here" r="0.28"></circle>
                    <text class="key-call" id="key-call"></text>
                  </svg>
                </div>
              </div>
            </div>
          </div>
          <div class="face back-face" id="back" aria-hidden="true" inert>
            <div class="band" id="solution-label"></div>
            <div class="board">
              <div class="maze-view">
                <div class="maze-world" id="solution-world">
                  <div class="maze-grid" id="solution-grid"></div>
                  <div class="maze-marks" id="solution-marks"></div>
                  <svg class="maze-lines" id="solution-lines">
                    <path class="walls" id="solution-walls"></path>
                    <path class="detour" id="detours"></path>
                    <polyline class="main" id="main"></polyline>
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>
        <button class="corner zoom-out" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 8h9"/></svg>
        </button>
        <button class="corner zoom-in" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 8h9M8 3.5v9"/></svg>
        </button>
        <button class="corner flip" id="flip" type="button" aria-pressed="false" aria-label="Show solution" title="Show solution">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 0 1 9.6-3.7M13.5 8a5.5 5.5 0 0 1-9.6 3.7"/><path d="M12.4 1.8v2.8H9.6M3.6 14.2v-2.8h2.8"/></svg>
        </button>
      </div>
      <div class="complete" id="complete" hidden>Puzzle complete</div>
    </div>

    <!-- Beside the maze, or under it on a phone: the little map while zoomed in, its sizes, and the
         control pad. -->
    <div class="controls" id="controls">
      <div class="map-box" id="map-box">
        <canvas class="minimap" id="minimap" aria-hidden="true"></canvas>
        <div class="map-sizes" role="group" aria-label="Map size">
          <button type="button" data-map-size="small" aria-pressed="true" aria-label="Small map" title="Small map">S</button>
          <button type="button" data-map-size="medium" aria-pressed="false" aria-label="Medium map" title="Medium map">M</button>
          <button type="button" data-map-size="large" aria-pressed="false" aria-label="Large map" title="Large map">L</button>
        </div>
      </div>
      <div class="pad" id="pad" role="group" aria-label="Control pad">
        <button class="pad-key up" type="button" data-press="N" aria-label="Up" title="Up">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 8 6l4.5 4.5"/></svg>
        </button>
        <button class="pad-key left" type="button" data-press="W" aria-label="Left" title="Left">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5 6 8l4.5 4.5"/></svg>
        </button>
        <button class="pad-key back" type="button" data-press="back" aria-label="Back" title="Back">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4 2.5 7l3 3"/><path d="M2.5 7h7a4 4 0 0 1 0 8H7"/></svg>
        </button>
        <button class="pad-key right" type="button" data-press="E" aria-label="Right" title="Right">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5 10 8l-4.5 4.5"/></svg>
        </button>
        <button class="pad-key down" type="button" data-press="S" aria-label="Down" title="Down">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5 8 10l4.5-4.5"/></svg>
        </button>
      </div>
    </div>

    <!-- Where a wordsearch's words would be — above the maze, or under the controls on a phone: what
         there is to find, ticked as it's found. -->
    <aside id="checklist-card">
      <div class="words-box">
        <div class="list-head">
          <h2>Checklist</h2>
          <span class="count" id="count"></span>
        </div>
        <ul class="checklist" id="checklist"></ul>
      </div>
    </aside>

    <!-- Signed out, the invitation to sign in; signed in, a note while the maze isn't saved — under
         the controls, or under the checklist on a phone. -->
    <div class="save-line" id="save-line" role="status" hidden>
      <p class="slip" id="save-hint" hidden>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15.5H5a3.5 3.5 0 0 1-.4-7A5 5 0 0 1 14.3 7 4 4 0 0 1 15 15.5h-1"/><path d="M10 16.5V10M7.5 12.3 10 9.8l2.5 2.5"/></svg>
        <span><button class="sign-in-link" id="save-sign-in" type="button">Sign in</button> to save your progress — or just play.</span>
      </p>
      <p class="slip slip-note" id="save-note" hidden><span class="dot" aria-hidden="true"></span>Progress not saved — reconnecting</p>
    </div>
  </main>
</div>
<script src="../components/site-bar.js"></script>
<script src="../vendor/supabase.js"></script>
<script type="module" src="../ui/sign-in-ui.js"></script>
<script type="module" src="../ui/side-bar-ui.js"></script>
<script type="module">
import { openMazePage } from '../ui/maze/play-ui.js';
openMazePage(location.search);
</script>
</body>
</html>

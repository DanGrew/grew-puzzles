<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grew Puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../styles/theme.css">
<link rel="stylesheet" href="../styles/site-bar.css">
<link rel="stylesheet" href="../styles/play.css">
</head>
<body>
<div class="wrap">
  <header class="site" data-site-bar data-home="index.html">
    <button type="button" data-menu-entry popovertarget="help">How to play</button>
    <button type="button" data-menu-entry id="print">Print</button>
  </header>

  <header class="play-head">
    <h1 id="title"></h1>
    <p class="created" id="created"></p>
  </header>
  <div class="help" id="help" popover>Tap a letter to circle it, then tap another in line with it. A red line means no match yet: tap any letter in line with the circle to point the line there. Tap the circled letter again to deselect.</div>

  <p class="missing" id="missing" hidden>There's no puzzle at this address. <a href="index.html">See all puzzles</a>.</p>

  <main class="play" id="play" hidden>
    <!-- The page's own letter size, however small the grid's letters are drawn to fit its words. -->
    <span class="cell-size" id="cell-size" aria-hidden="true"></span>
    <div class="col">
      <div class="stage" id="stage">
        <div class="card" id="card">
          <div class="face front-face" id="front">
            <div class="band" id="label"></div>
            <div class="tabs" id="tabs" role="tablist" aria-label="Pages"></div>
            <div class="board" id="board">
              <div class="grid" id="grid"></div>
              <svg class="overlay" id="overlay" aria-hidden="true"></svg>
            </div>
          </div>
          <div class="face back-face" id="back" aria-hidden="true" inert>
            <div class="band" id="solution-label"></div>
            <div class="tabs" id="solution-tabs" role="tablist" aria-label="Pages"></div>
            <div class="board">
              <div class="grid" id="solution-grid"></div>
              <svg class="overlay" id="solution-overlay" aria-hidden="true"></svg>
            </div>
          </div>
        </div>
        <button class="corner flip" id="flip" type="button" aria-pressed="false" aria-label="Show solution" title="Show solution">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 0 1 9.6-3.7M13.5 8a5.5 5.5 0 0 1-9.6 3.7"/><path d="M12.4 1.8v2.8H9.6M3.6 14.2v-2.8h2.8"/></svg>
        </button>
        <button class="corner words-layout" id="words-layout" type="button">
          <svg class="icon-bottom" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="1.8" width="11" height="7.4" rx="1"/><path d="M3 12h10M3 14.4h7"/></svg>
          <svg class="icon-right" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="2.5" width="7.4" height="11" rx="1"/><path d="M12 4.5h2.4M12 8h2.4M12 11.5h2.4"/></svg>
          <svg class="icon-overlay" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="1.5"/><path d="M5 5.8h6M5 8.3h6M5 10.8h3.6"/></svg>
        </button>
        <button class="corner text-size" id="text-size" type="button" popovertarget="text-size-menu" aria-label="Text size" title="Text size">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 13.5 5.5 2.5l4 11M3 9.5h5M10 13.5l2.5-6.5 2.5 6.5M10.9 11.3h3.2"/></svg>
        </button>
        <!-- The five sizes, each its "Aa" at the letters it gives; pressing outside closes it. -->
        <div class="text-size-menu" id="text-size-menu" popover role="menu" aria-label="Text size"></div>
        <button class="corner words-toggle" id="words-toggle" type="button" aria-controls="words-list">
          <svg class="icon-expand" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9.2 6.8M2.5 13.5l4.3-4.3"/></svg>
          <svg class="icon-collapse" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 6.5h-4v-4M2.5 9.5h4v4M9.5 6.5l4-4M6.5 9.5l-4 4"/></svg>
        </button>
      </div>
      <div class="complete" id="complete" hidden>Puzzle complete</div>
    </div>

    <!-- Where the list sits under or beside the grid: always before the printed grids. -->
    <div class="words-home" id="words-home">
      <aside id="words-list">
        <div class="words-box">
          <div class="list-head">
            <h2>Words</h2>
            <span class="count" id="count"></span>
          </div>
          <ul class="words" id="words"></ul>
        </div>
      </aside>
    </div>

    <!-- A puzzle of several grids prints each one on a sheet of its own, after the words. -->
    <div class="print-grids" id="print-grids"></div>
    <template id="grid-sheet"><section class="grid-sheet"><header class="play-head"><h1></h1></header><div class="face print-face"><div class="band"></div><div class="grid"></div></div></section></template>
  </main>
</div>
<script src="../components/site-bar.js"></script>
<script src="../vendor/supabase.js"></script>
<script type="module" src="../ui/sign-in-ui.js"></script>
<script type="module">
import { openPlayPage } from '../ui/wordsearch/play-ui.js';
openPlayPage(location.search);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grew Puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../styles/theme.css">
<link rel="stylesheet" href="../styles/site-bar.css">
<link rel="stylesheet" href="../styles/browse.css">
</head>
<body>
<div class="wrap">
  <header class="site" data-site-bar data-home="index.html" data-current="wordsearches"></header>
  <main aria-labelledby="browse-title">
    <div class="browse-head">
      <h1 id="browse-title">Wordsearches</h1>
      <span id="total"></span>
    </div>
    <ul class="tiles" id="tiles"></ul>
    <nav class="pager" id="pager" aria-label="Pages"></nav>
  </main>
</div>
<script src="../components/site-bar.js"></script>
<script type="module">
import { pageOf, pageCount, tileDetail, playHref, totalLabel, pagerButtons } from '../core/browse-core.js';

const tiles = document.getElementById('tiles');
const pager = document.getElementById('pager');
let puzzles = [];

function part(className, text) {
  const span = document.createElement('span');
  span.className = className;
  span.textContent = text;
  return span;
}

function tile(puzzle) {
  const a = document.createElement('a');
  a.className = 'tile';
  a.href = playHref(puzzle.hiddenId);
  const detail = part('detail', '');
  detail.append(...tileDetail(puzzle).map(text => part('line', text)));
  a.append(part('name', puzzle.title), detail);
  const li = document.createElement('li');
  li.append(a);
  return li;
}

function pagerButton(spec) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = spec.label;
  b.disabled = spec.disabled;
  b.setAttribute('aria-label', spec.aria);
  b.setAttribute('aria-current', spec.current);
  b.addEventListener('click', () => show(spec.target));
  return b;
}

function show(page) {
  tiles.replaceChildren(...pageOf(puzzles, page).map(tile));
  pager.replaceChildren(...pagerButtons(page, pageCount(puzzles.length)).map(pagerButton));
}

function load(index) {
  puzzles = index.puzzles;
  document.getElementById('total').textContent = totalLabel(puzzles.length);
  show(1);
}

fetch('../content/puzzles/wordsearch/index.json')
  .then(r => r.json())
  .then(load);
</script>
</body>
</html>

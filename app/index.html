<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grew Puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../styles/theme.css">
<link rel="stylesheet" href="../styles/site-bar.css">
<link rel="stylesheet" href="../styles/browse.css">
<link rel="stylesheet" href="../styles/look.css">
</head>
<body>
<div class="wrap">
  <header class="site" data-site-bar data-home="index.html" data-current="wordsearches"></header>
  <main aria-labelledby="browse-title">
    <div class="browse-head">
      <h1 id="browse-title">Wordsearches</h1>
      <span id="total"></span>
    </div>
    <section class="rail" id="rail" aria-labelledby="rail-title" hidden>
      <div class="rail-head">
        <h2 id="rail-title">Continue playing</h2>
        <button type="button" id="rail-prev" aria-label="Previous puzzles in play">‹</button>
        <button type="button" id="rail-next" aria-label="More puzzles in play">›</button>
      </div>
      <ul class="tiles" id="rail-tiles"></ul>
    </section>
    <div class="controls">
      <button type="button" class="filter-button" id="filter-button" aria-expanded="false" aria-controls="filters">Filters</button>
      <div class="filter-popup" id="filters" role="group" aria-label="Filters" hidden>
        <div class="filter-rows" id="filter-rows">
          <div class="finished-cell" hidden><span class="row-name">Finished</span></div>
          <div class="finished-cell choices" hidden></div>
        </div>
        <button type="button" class="clear" id="clear" hidden>Clear filters</button>
      </div>
      <label class="sort">Sort by
        <select id="sort">
          <option value="difficulty">Difficulty</option>
          <option value="date">Date</option>
          <option value="title">Title</option>
          <option value="type">Type</option>
        </select>
      </label>
      <button type="button" class="dir" id="dir" title="Reverse the order"></button>
    </div>
    <ul class="tiles" id="tiles"></ul>
    <nav class="pager" id="pager" aria-label="Pages"></nav>
  </main>
</div>
<script src="../components/site-bar.js"></script>
<script src="../vendor/supabase.js"></script>
<script type="module" src="../ui/sign-in-ui.js"></script>
<script type="module">
import {
  filterOptions, browseItems, browseState, browseSearch, browseList, pageOf, pageCount, filterRows, picked, toggleType,
  toggleRow, filtersLabel, clearFilters, nothingPicked, withSort, flipDir, dirLabel, totalLabel, pagerButtons, railItems,
  columnsOf, railView, toggleFinished, finishedPressed, filtersByProgress, withSignIn,
} from '../core/browse-core.js';
import { wireDone, withDone, paintDone } from '../ui/wordsearch/done-ui.js';
import { tileCharacter, randomCharacter, charactersFile, charactersOf } from '../core/theme-core.js';
import { dressScene, dressFigure } from '../ui/theme-ui.js';

const tiles = document.getElementById('tiles');
const pager = document.getElementById('pager');
const filterButton = document.getElementById('filter-button');
const filters = document.getElementById('filters');
const rows = document.getElementById('filter-rows');
// The Finished row's two cells, last in the popup, shown only while someone is signed in.
const finishedCells = [...rows.querySelectorAll('.finished-cell')];
const clear = document.getElementById('clear');
const sort = document.getElementById('sort');
const dir = document.getElementById('dir');
const rail = document.getElementById('rail');
const railTiles = document.getElementById('rail-tiles');
const railPrev = document.getElementById('rail-prev');
const railNext = document.getElementById('rail-next');
let items = [];
let types = [];
// The owner's characters: each tile wears its puzzle's, shown only while Themed is on.
let characters = [];
let state;
// The puzzles the player has finished — none until they're looked up, and never signed out — and
// each tile on show's ✓, repainted as they arrive.
let done = [];
let ticks = [];
// The puzzles still in play, most recently played first, and which set of them the rail shows.
let playing = [];
let railSet = 0;
// Each filter in the popup repaints itself pressed or not as the picks change — the popup is
// drawn once, so a press never loses keyboard focus.
const painters = [];

function part(className, text) {
  const span = document.createElement('span');
  span.className = className;
  span.textContent = text;
  return span;
}

function card(item) {
  const a = document.createElement('a');
  a.className = `tile ${item.kind}`;
  a.dataset.type = item.type;
  a.dataset.tone = item.tone;
  a.href = item.href;
  const detail = part('detail', '');
  detail.append(...item.lines.map(text => part('line', text)));
  const figure = part('theme-figure', '');
  figure.setAttribute('aria-hidden', 'true');
  dressFigure(figure, tileCharacter(characters, item));
  a.append(figure, part('name', item.title), detail);
  return a;
}

function tile(item) {
  const a = card(item);
  ticks.push(() => paintDone(a, item, done));
  paintDone(a, item, done);
  const li = document.createElement('li');
  li.append(a);
  return li;
}

// A rail tile is a browse tile — never finished, so never ticked.
function railTile(item) {
  const li = document.createElement('li');
  li.append(card(item));
  return li;
}

// The rail shows before it is measured: as many tiles fit across as the browser lays out columns
// for, so a narrower window shows fewer. Nothing in play shows no rail at all.
function showRail(set) {
  rail.hidden = playing.length === 0;
  const view = railView(playing, set, columnsOf(getComputedStyle(railTiles).gridTemplateColumns));
  railSet = view.set;
  railTiles.replaceChildren(...view.tiles.map(railTile));
  railPrev.hidden = !view.prev;
  railNext.hidden = !view.next;
}

railPrev.addEventListener('click', () => showRail(railSet - 1));
railNext.addEventListener('click', () => showRail(railSet + 1));
window.addEventListener('resize', () => showRail(railSet));

function pagerButton(spec) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = spec.label;
  b.disabled = spec.disabled;
  b.setAttribute('aria-label', spec.aria);
  b.setAttribute('aria-current', spec.current);
  b.addEventListener('click', () => show(spec.target));
  return b;
}

// A button in the popup: pressing it picks, pressed says whether it shows pressed.
function filter(className, label, pressed, pick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = className;
  b.textContent = label;
  b.addEventListener('click', () => update(pick(state)));
  painters.push(() => b.setAttribute('aria-pressed', pressed(state)));
  return b;
}

// The Finished row's choices: Finished, the ✓ tiles, and Not finished, the rest.
finishedCells[1].append(
  filter('choice', 'Finished', s => finishedPressed(s, 'yes'), s => toggleFinished(s, 'yes')),
  filter('choice', 'Not finished', s => finishedPressed(s, 'no'), s => toggleFinished(s, 'no')),
);

// A row is two cells: the difficulty's name — none for Collections — and a chip per type, each
// pressed while every type it stands for is picked.
function row(spec) {
  const name = document.createElement('div');
  name.dataset.tone = spec.tone;
  const level = filter('level', spec.name, s => picked(s, spec.types), s => toggleRow(s, spec.types));
  level.hidden = !spec.name;
  name.append(level);
  const chips = document.createElement('div');
  chips.className = 'types';
  chips.dataset.tone = spec.tone;
  chips.append(...spec.types.map(type => filter('chip', type, s => picked(s, [type]), s => toggleType(s, type))));
  return [name, chips];
}

function show(page) {
  const list = browseList(items, state, done);
  document.getElementById('total').textContent = totalLabel(list);
  painters.forEach(paint => paint());
  filterButton.textContent = filtersLabel(state);
  clear.hidden = nothingPicked(state);
  sort.value = state.sort;
  dir.textContent = dirLabel(state);
  ticks = [];
  tiles.replaceChildren(...pageOf(list, page).map(tile));
  pager.replaceChildren(...pagerButtons(page, pageCount(list.length)).map(pagerButton));
}

// Every change to the filter or sort goes into the page address — so back and a shared link keep
// it — and starts again from page 1.
function update(next) {
  state = next;
  history.replaceState(null, '', location.pathname + browseSearch(state));
  show(1);
}

// Clearing hides Clear filters, so the keyboard goes back to the Filters button.
clear.addEventListener('click', () => {
  update(clearFilters(state));
  filterButton.focus();
});
sort.addEventListener('change', () => update(withSort(state, sort.value)));
dir.addEventListener('click', () => update(flipDir(state)));

// The popup opens and closes the way the site bar's menu does: its button, a press outside it or
// Escape closes it, and the keyboard goes back to the button — unless the press outside landed
// on something that takes the keyboard itself, like the sort.
function setFilters(open) {
  filters.hidden = !open;
  filterButton.setAttribute('aria-expanded', String(open));
}

function closeFilters() {
  const adrift = [document.activeElement === document.body, filters.contains(document.activeElement)];
  setFilters(false);
  [() => filterButton.focus()].filter(() => adrift.some(Boolean)).forEach(focus => focus());
}

function closeOpenFilters(...also) {
  [closeFilters].filter(() => [!filters.hidden, ...also].every(Boolean)).forEach(close => close());
}

filterButton.addEventListener('click', e => {
  e.stopPropagation();
  setFilters(filters.hidden);
  filterButton.focus();
});
filters.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => closeOpenFilters());
document.addEventListener('keydown', e => closeOpenFilters(e.key === 'Escape'));

// The ticks, the rail and the Finished row come from one read of the player's progress. The filters,
// sort and search never touch the rail. With a Finished choice picked the tiles shown hang on the
// progress, so they're drawn again — and signed out, the choice is dropped and every tile comes back.
const REDRAWS = { true: () => update(state), false: () => ticks.forEach(paint => paint()) };

function tick(progress) {
  const redraw = REDRAWS[filtersByProgress(state)];
  done = progress.done;
  state = withSignIn(state, progress.signedIn);
  finishedCells.forEach(cell => { cell.hidden = !progress.signedIn; });
  redraw();
  playing = railItems(items, progress.playing);
  showRail(0);
}

// The tiles never wait for the ticks or the rail, which follow whoever is signed in. A page brought back from
// the browser's cache — back, after finishing a puzzle — looks them up again.
const RETURNS = { true: () => withDone(items, tick), false: () => {} };
window.addEventListener('pageshow', e => RETURNS[e.persisted]());

// The site bar's Collections entry shows only while a collection exists. An address with a Finished
// choice draws no tiles until the progress arrives, so none ever show only to drop out.
const FIRST_DRAWS = { true: () => {}, false: () => show(1) };

function load([index, mazes, published, owned]) {
  const puzzles = index.puzzles.concat(mazes.puzzles);
  characters = owned;
  dressScene(randomCharacter(characters, Math.random));
  items = browseItems(puzzles, published.collections);
  types = filterOptions(puzzles, published.collections);
  document.querySelector('[data-entry="collections"]').hidden = published.collections.length === 0;
  state = browseState(location.search, types);
  rows.replaceChildren(...filterRows(types).flatMap(row), ...finishedCells);
  FIRST_DRAWS[filtersByProgress(state)]();
  wireDone(items, tick);
}

// A site with no collections has no collections file, and one with no mazes no maze index: each
// reads as none. Characters that can't be read dress nothing — the tiles still draw.
Promise.all([
  fetch('../content/puzzles/wordsearch/index.json').then(r => r.json()),
  fetch('../content/puzzles/maze/index.json').then(r => r.json()).catch(() => ({ puzzles: [] })),
  fetch('../content/collections/index.json').then(r => r.json()).catch(() => ({ collections: [] })),
  fetch(charactersFile()).then(r => r.json()).then(charactersOf).catch(() => []),
]).then(load);
</script>
</body>
</html>
